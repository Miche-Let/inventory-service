eureka:
    client:
        enabled: false # 테스트 시 유레카 서버 연결 시도 방지

spring:
    cloud:
        discovery:
            enabled: false # 서비스 디스커버리 기능 끔

    # 테스트 시 레디스/Redisson 자동 설정을 완전히 제외하여 연결 에러 방지
    autoconfigure:
        exclude:
            - org.redisson.spring.starter.RedissonAutoConfigurationV2
            - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
            - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
            - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

    # JPA/H2 설정: 인메모리 DB 사용
    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
        username: sa
        password:

    jpa:
        #        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    kafka:
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

internal:
    auth:
        secret: ${INTERNAL_AUTH_SECRET:michelet-internal-auth-secret-key-a8K2mQ9xLp4Vt7Rz1Nc}
jwt:
    secret: ${JWT_SECRET:michelet-secret-key-for-authentication}

inventory:
    retry:
        max-count: 3
    kafka:
        topic:
            product-created: "product.created"
            reserved: "stock.reserved"
            restored: "stock.restored"
            status-changed: "product.status-changed"
            daily-reset: "stock.daily-reset"
            inventory-command: "inventory.command"
