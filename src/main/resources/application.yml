spring:
    application:
        name: inventory-service
    profiles:
        active: local
    jpa:
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                default_schema: inventory_service
                hbm2ddl.create_namespaces: true

    kafka:
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all                                 # 모든 ISR 복제본으로부터 ack 수신 후 성공 처리
            retries: 3                                # 일시적 오류 시 최대 3회 재시도
            properties:
                enable.idempotence: true              # 재시도로 인한 중복 메시지 방지 (exactly-once)
                max.in.flight.requests.per.connection: 5
                retry.backoff.ms: 1000
                max.block.ms: 3000
        consumer:
            group-id: inventory-service-consumer
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            # 에러 시 무한 루프 방지를 위한 ErrorHandlingDeserializer 래퍼 적용
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            properties:
                # 실제 역직렬화를 수행할 델리게이트 클래스 지정
                spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.trusted.packages: "com.michelet.inventory.infrastructure.messaging.dto,com.michelet.order.application.dto"
                spring.json.use.type.headers: true
                # 서로 다른 패키지의 이벤트를 1:1로 매핑
                spring.json.type.mapping: "com.michelet.order.application.dto.StockRestoreEventPayload:com.michelet.inventory.infrastructure.messaging.dto.StockRestoreMessage,com.michelet.order.application.dto.OrderCreatedEventPayload:com.michelet.inventory.infrastructure.messaging.dto.OrderCreatedMessage"

server:
    port: 19900

inventory:
    retry:
        max-count: 3
    kafka:
        topic:
            product-created: "product.created"
            reserved: "stock.reserved"
            restore-request: "order.stock-restore.requested" # 오더의 '명령'을 수신할 토픽
            restored: "stock.restored" # 카탈로그로 '결과'를 발송할 토픽
            status-changed: "product.status-changed"
            daily-reset: "stock.daily-reset"
            product-updated: "product.updated"
            order-created: "order.created"
            order-approved: "order.approved"
            order-rejected: "order.rejected"
        consumer:
            retry:
                interval-ms: 1000
                max-attempts: 3
    outbox:
        max-retries: 3 # 최대 재시도 횟수 설정

internal:
    auth:
        secret: ${INTERNAL_AUTH_SECRET}
jwt:
    secret: ${JWT_SECRET}

logging:
    level:
        root: INFO
        # 카프카 및 유레카 관련 잡다한 INFO 로그 억제 (경고 이상만 출력)
        org.apache.kafka: WARN
        com.netflix.discovery: WARN
        org.springframework.kafka: WARN
